<!--/BRAND-->
<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --line:#dde2ea; --text:#1b2330; --muted:#667085;
  --pri:#0a2961; --pri-soft:#e6ebf4; --gold:#f3b900; --gold-soft:#fff6d6;   /* 연세오케이정형외과 남색·노랑 */ --ok:#16a34a; --ok-soft:#e7f7ec;
  --warn:#d97706; --warn-soft:#fff4e0; --bad:#dc2626; --bad-soft:#fdecec;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:3px solid var(--gold);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px}
header h1{font-size:17px;margin:0;white-space:nowrap}
.brand{display:flex;align-items:center;gap:8px}
.brand img{height:34px;width:auto;max-width:280px;object-fit:contain}
.brand small{font-size:13px;color:var(--muted);font-weight:600}
header .clock{font-variant-numeric:tabular-nums;color:var(--muted)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:none;padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:600}
nav.tabs button.on{background:var(--pri);color:#fff}
.sync{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.err i{background:var(--bad)} .sync.busy i{background:var(--warn)}
main{padding:14px 16px 60px;max-width:1500px;margin:0 auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:600}
.btn:hover{border-color:#b9c2d0}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:7px 14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--pri);color:#fff}
.muted{color:var(--muted)} .small{font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
h2{font-size:16px;margin:0 0 10px} h3{font-size:14px;margin:14px 0 6px}
/* 배치도 */
.floor{margin-top:12px;background:var(--panel);border:4px solid #3b4556;border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:12px}
.strip{border:3px solid #3b4556;border-radius:3px;padding:8px;display:grid;grid-template-columns:repeat(var(--pairs),minmax(0,1fr));gap:10px}
.pair{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:5px;background:#eef2f7;border-radius:7px;padding:5px}
.floor-mid{min-height:70px;display:flex;align-items:center;justify-content:center;color:#b6bfcc;font-weight:800;letter-spacing:4px;font-size:18px}
.floor-bottom{display:grid;grid-template-columns:1.25fr .9fr 1fr 1fr;gap:12px;align-items:stretch}
.zone{border:3px solid #3b4556;border-radius:3px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;min-height:80px}
.station,.lounge{align-self:end;height:90px;background:#f8fafc}
.lounge{height:auto}
.door{border:0;align-items:flex-end;padding-bottom:0}
.door span{border-top:6px solid var(--pri);padding-top:4px;width:70%;text-align:center;color:var(--pri)}
.exroom{flex-direction:column;align-items:stretch;justify-content:flex-start;padding:6px;gap:5px}
.zone-t{font-size:12px;text-align:center}
.tile{position:relative;min-height:128px;border-radius:8px;display:flex;flex-direction:column;min-width:0}
.tile .no{font-weight:800;font-size:15px}
.tile.empty{border:1.5px dashed #b9c3d1;background:#fff;color:var(--muted)}
.tile-main{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px}
.tile.empty .no{position:absolute;top:5px;left:8px}
.tile.empty .plus{font-size:22px;line-height:1}
.tile.empty .hint{font-size:11.5px}
.tile.empty:hover,.tile.empty.pick{border:1.5px solid var(--pri);color:var(--pri);background:var(--pri-soft)}
.tile .pin{position:absolute;top:4px;right:4px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11.5px;padding:1px 6px;color:var(--muted)}
.tile .pin:hover{border-color:#f59e0b;color:#c2410c;background:#fff7ed}
.tile.hold{border:1.5px solid #f59e0b;background:#fff7ed;padding-bottom:5px}
/* 끌어서 옮기기 */
.tile.run .tile-body,[data-act=pick],[data-drag-ended]{cursor:grab}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
body.drag-any .tile.empty,body.drag-pt .tile.empty[data-room=pt],body.drag-ex .tile.empty[data-room=ex]{outline:2px dashed #16a34a;outline-offset:-3px}
.tile.drop-ok{outline:3px solid #16a34a!important;background:#e7f7ec!important}
.tile.drop-no{outline:3px solid var(--bad)!important;background:var(--bad-soft)!important}
.tile.drag-src{opacity:.45}
#dragGhost{position:fixed;z-index:200;pointer-events:none;background:var(--pri);color:#fff;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13.5px;box-shadow:0 6px 16px rgba(0,0,0,.25);transform:translate(-50%,-130%)}
.tile.run{border:1.5px solid #9db8f5;background:#fff;padding:0 0 5px}
.tile.run.soon{border-color:var(--warn);background:var(--warn-soft)}
.tile.run.over{border-color:var(--bad);background:var(--bad-soft);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(220,38,38,.2)}}
.tile-body{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:1px;padding:5px 7px 3px;flex:1;min-width:0}
.tile-body .row{gap:4px}
.tile .pt{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .mods{font-size:11.5px;color:var(--muted);white-space:normal;overflow:hidden;max-height:3.4em;line-height:1.6}
.tile .timer{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;white-space:nowrap}
.tile.soon .timer{color:var(--warn)} .tile.over .timer{color:var(--bad);font-size:16px}
.bar{display:block;height:5px;background:#e6ebf2;border-radius:3px;overflow:hidden;margin-top:2px}
.bar b{display:block;height:100%;background:var(--pri)}
.tile.soon .bar b{background:var(--warn)} .tile.over .bar b{background:var(--bad)}
.tile-go{margin:0 5px;padding:3px 0}
.exfloor{border-width:3px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.lists{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:1100px){.lists{grid-template-columns:1fr 1fr}.strip{grid-template-columns:repeat(3,minmax(0,1fr))}.floor-bottom{grid-template-columns:1fr 1fr}.station,.door{display:none}}
@media (max-width:700px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.lists{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column;gap:6px}
.item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel);display:flex;gap:8px;align-items:center}
.item .grow{min-width:0}
.item.sel{border-color:var(--pri);background:var(--pri-soft)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:5px;padding:1px 6px;background:#eef1f5;color:var(--muted)}
.tag.run{background:var(--pri-soft);color:var(--pri)} .tag.wait{background:var(--warn-soft);color:var(--warn)}
.tag.done{background:var(--ok-soft);color:var(--ok)} .tag.cancel{background:var(--bad-soft);color:var(--bad)}
.mp{display:inline-block;border:1px solid;border-radius:6px;padding:0 5px;font-size:11.5px;font-weight:700;line-height:1.5;margin:1px 1px 1px 0}
.mp.dim{opacity:.55}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:2px;vertical-align:0}
.dots{margin-right:5px;white-space:nowrap}
.tile.run{background:var(--tint,#fff)!important;border-color:var(--tbd,#9db8f5)!important}
.tile.run.soon{background:var(--warn-soft)!important;border-color:var(--warn)!important}
.tile.run.over{background:var(--bad-soft)!important;border-color:var(--bad)!important}
.mod{border-left:5px solid var(--mbd,var(--line))!important}
.mod.on{background:var(--mbg,#f5f8ff)!important}
.tag.ins-ta{background:#ffe3e3;color:#b42318;font-weight:800}
.tag.ins-etc{background:#e8f1ff;color:#1d4ed8}
.tag.hold{background:#ffedd5;color:#c2410c}
.tag.emrok{background:#e9e4ff;color:#5b3fd6}
.tag{white-space:nowrap}
/* forms */
dialog{border:0;border-radius:14px;padding:0;width:min(880px,calc(100vw - 20px));max-height:calc(100vh - 20px);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog.cfm{width:min(480px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(15,23,42,.45)}
.dlg-h{position:sticky;top:0;background:var(--panel);z-index:2;padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dlg-h h2{margin:0}
.dlg-b{padding:14px 18px;display:flex;flex-direction:column;gap:12px}
.dlg-f{position:sticky;bottom:0;background:var(--panel);padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);font-weight:600}
label.f.req>span::after{content:" *";color:var(--bad)}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff;width:100%;min-width:0;color:var(--text);font-weight:400}
textarea{resize:vertical;min-height:58px}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd0fb;border-color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.mod{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fbfcfe}
.mod.on{border-color:#bcd0fb;background:#f5f8ff}
.mod-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mod-h .nm{font-weight:700}
.mins{display:inline-flex;gap:3px;align-items:center}
.mins input{width:58px;text-align:center}
.warnbox{border-radius:8px;padding:8px 12px;background:var(--warn-soft);color:#8a4b00;font-size:13.5px}
.errbox{border-radius:8px;padding:8px 12px;background:var(--bad-soft);color:#991b1b;font-size:13.5px}
.warnbox ul,.errbox ul{margin:4px 0 0;padding-left:18px}
.emr{font:13px/1.55 ui-monospace,Menlo,Consolas,"D2Coding",monospace;white-space:pre-wrap;min-height:220px}
.ac{position:relative}
.ac-list{position:absolute;left:0;min-width:min(420px,calc(100vw - 60px));top:100%;z-index:5;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.12);max-height:220px;overflow:auto}
.ac-list button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px}
.ac-list button:hover,.ac-list button.on{background:var(--pri-soft)}
.ac-list u{text-decoration:none;background:var(--gold-soft)}
table.t{width:100%;border-collapse:collapse;background:var(--panel);font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{font-size:12.5px;color:var(--muted);background:#f8fafc;position:sticky;top:0}
table.t tr.cancel td{color:var(--muted);text-decoration:line-through}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius)}
.hist{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:10px}
.hist .hh{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hist pre{margin:0;padding:10px 12px;font:13px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#1f2937;color:#fff;padding:9px 16px;border-radius:9px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none}
#toast div.alarm{background:var(--bad);font-weight:700;font-size:15px}
.banner{background:var(--warn-soft);color:#8a4b00;border-bottom:1px solid #f3d9a6;padding:7px 16px;font-size:13px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:14px}
.empty-note{padding:18px;text-align:center;color:var(--muted)}
@media print{
  header,nav,.no-print,.banner,#toast{display:none!important}
  body{background:#fff} main{padding:0}
  .hist{break-inside:avoid;border-color:#999}
}
</style>

  db(){ try{ return JSON.parse(localStorage.getItem(DB_KEY)) || {records:{}, patients:{}, settings:null, audit:[], version:'0'}; }catch(e){ return {records:{}, patients:{}, settings:null, audit:[], version:'0'}; } },
  put(db){ db.version=String(Date.now()); localStorage.setItem(DB_KEY, JSON.stringify(db)); return db.version; },
  async init(date){ const db=this.db(); return {settings:db.settings, records:Object.values(db.records).filter(r=>inBoard(r,date)), version:db.version}; },
  async poll(date, version){ const db=this.db(); if(db.version===version) return {same:true}; return {settings:db.settings, records:Object.values(db.records).filter(r=>inBoard(r,date)), version:db.version}; },
  async save(rec, base, by){
    const db=this.db(); const old=db.records[rec.id];
    if(old && base && old.updatedAt!==base) return {conflict:true, record:old};
    const ch=auditDiff(old, rec); if(ch) db.audit.push({ts:nowIso(), id:rec.id, regNo:rec.regNo, action:old?'수정':'생성', changes:ch, by});
    db.records[rec.id]=rec; if(rec.status==='done') rememberPatient(db.patients, rec);
    else if(!db.patients[rec.regNo] && rec.regNo) db.patients[rec.regNo]={regNo:rec.regNo, name:rec.name, memo:'', plan:null, updatedAt:nowIso()};
    this.put(db); return {record:rec};

  async remove(rec, reason, by){ const db=this.db(); delete db.records[rec.id]; db.audit.push({ts:nowIso(), id:rec.id, regNo:rec.regNo, action:'삭제', changes:reason||'', by}); this.put(db); return {ok:true}; },

function inBoard(r, date){
  if(r.date===date) return true;
  const d=new Date(date+'T00:00:00'); d.setDate(d.getDate()-7);
  return (r.status==='ended'||r.status==='running') && r.date<date && r.date>=ymd(d);
}
// 환자별 최근 처방 기억 (서버 Code.gs 에도 같은 로직)
function rememberPatient(patients, rec){
  const p = patients[rec.regNo] || {regNo:rec.regNo, memo:''};
  p.name = rec.name;
  p.plan = {room:rec.room, visit:rec.visit, ins:rec.ins, dx:rec.dx, sites:rec.sites, side:rec.side, doctor:rec.doctor,
            items:rec.items.map(i=>({mid:i.mid, min:i.min, phase:i.phase, params:i.params})), date:rec.date};
  p.updatedAt = nowIso(); patients[rec.regNo]=p;
}
// 수정 이력 비교 (서버 Code.gs 에도 같은 로직)
function auditDiff(a, b){
  const pick = r => r ? {등록번호:r.regNo, 이름:r.name, 상태:r.status, 처방의:r.doctor, 시행자:r.therapist, 베드:r.bed,
      항목:(r.items||[]).map(i=>`${i.mid}:${i.min}분 ${i.start?hm(i.start):'-'}~${i.end?hm(i.end):'-'}`).join(' | '),
      EMR입력:r.emrDone?'Y':'N'} : {};
  const x=pick(a), y=pick(b), out=[];
  for(const k of Object.keys(y)) if(String(x[k]??'')!==String(y[k]??'')) out.push(`${k}: ${x[k]??''} → ${y[k]??''}`);
  return out.join('\n');
}

  for(const [id,o] of Object.entries(s.mods)){
    const base=MODALITIES.find(m=>m.id===id), old=OLD_MOD_DEFAULTS[id]||{};
    for(const k of Object.keys(o)) if(base && (o[k]===base[k] || (k in old && o[k]===old[k]))) delete o[k];
    if(!Object.keys(o).length) delete s.mods[id];

}

const tms = iso => new Date(iso).getTime();
const phaseStart = (r,p) => r.items.filter(i=>i.phase===p && i.start).map(i=>i.start).sort()[0] || null;
const phaseEnd = (r,p) => { const its=r.items.filter(i=>i.phase===p && i.start); return its.length ? Math.max(...its.map(i=>tms(i.start)+i.min*60000)) : null; };
/** 뒤 순서 항목의 시작 시각 = 앞 순서의 예정 종료 시각 (연장·수정 후 다시 계산) */
function schedule(r){
  let cursor=null;
  for(const p of phasesOf(r)){
    const its=r.items.filter(i=>i.phase===p);
    if(cursor!=null) its.forEach(i=>{ if(!i.end) i.start=new Date(cursor).toISOString(); });
    const e=phaseEnd(r,p); if(e==null) break; cursor=e;
  }
  return r;
}
/** 지금 진행 중인 순서 */
function curPhase(r, now=Date.now()){
  const ph=phasesOf(r); let cur=ph[0];
  for(const p of ph){ const st=phaseStart(r,p); if(st && tms(st)<=now) cur=p; }
  return cur;
}
const lastPhase = r => phasesOf(r).slice(-1)[0];
const itemRemain = (it, now) => it.start ? tms(it.start) + it.min*60000 - now : null;
/** 남은 시간: 마지막 순서면 전체 종료까지, 아니면 이번 순서 끝(다음 치료 시작)까지 */
function recRemain(r, now=Date.now()){
  if(!r.items.length) return null;
  const p=curPhase(r,now), e=phaseEnd(r,p);
  return e==null ? null : e-now;
}
function recProgress(r, now=Date.now()){
  const p=curPhase(r,now), st=phaseStart(r,p), e=phaseEnd(r,p);
  if(!st||!e) return 0;
  return Math.min(1, Math.max(0,(now-tms(st))/(e-tms(st))));
}
/** [종료]: 모든 항목 종료 시각을 정하고 작성 대기로. 시작 전인 항목은 시행 안 한 것으로 보고 뺀다 */
function finishRec(r, t){
  schedule(r); const lp=lastPhase(r), fp=phasesOf(r)[0], dropped=[];
  r.items = r.items.filter(it=>{
    if(it.end) return true;
    // 뒤 순서 항목이 아직 시작 전이면 시행 안 한 것으로 뺀다 (기기 간 시계 차이 1분은 허용, 첫 치료는 빼지 않음)
    if(it.phase!==fp && (!it.start || tms(it.start) - tms(t) > 60000)){ dropped.push(MOD(it.mid)?.name||it.mid); return false; }
    const planned=new Date(tms(it.start)+it.min*60000).toISOString();
    it.end = (it.phase===lp && !MOD(it.mid)?.autoStop) ? t : (planned < t ? planned : t);
    if(it.end < it.start) it.end = it.start;   // 기기 간 시계 차이 방어
    return true;
  });
  finalizeTimes(r); r.status='ended';
  return dropped;
}
function finalizeTimes(r){
  const st=r.items.map(i=>i.start).filter(Boolean).sort(); const en=r.items.map(i=>i.end).filter(Boolean).sort();
  r.startAt=st[0]||r.startAt; r.endAt=en[en.length-1]||r.endAt;
}

/* ===================== 기록문(EMR) 생성 ===================== */
// 강도·조건은 기본 권고값으로 고정 기록 (운동·도수의 서술형 항목만 직접 작성)
const isFixed = m => !!m && !m.format;
function paramsOf(it){
  const m=MOD(it.mid); const p={...(it.params||{})};
  for(const f of (m&&m.fields)||[]){ const v=p[f.k]; if((v==null||v===''||(Array.isArray(v)&&!v.length)) && f.def!=null) p[f.k]=f.def; }
  return p;
}
function fillTpl(tpl, params){
  // 값이 빈 항목이 들어간 구절은 통째로 뺀다
  return tpl.split(/,\s*/).filter(part => !(part.match(/\{(\w+)\}/g)||[]).some(m => { const v=params[m.slice(1,-1)]; return v==null || v==='' || (Array.isArray(v)&&!v.length); }))
    .map(part => part.replace(/\{(\w+)\}/g, (_,k)=>params[k])).join(', ');
}
function siteText(r){ return [r.side, (r.sites||[]).join(', ')].filter(Boolean).join(' ') + (r.siteEtc ? (r.sites&&r.sites.length?', ':'')+r.siteEtc : ''); }
function nrsText(a,b){ if(a!==''&&a!=null&&b!==''&&b!=null) return `NRS ${a}→${b}`; if(a!==''&&a!=null) return `NRS ${a}`; if(b!==''&&b!=null) return `NRS ${b}`; return ''; }
function genEmr(r){
  const L=[]; const sc=S.settings.showCode;
  const st=r.items.map(i=>i.start).filter(Boolean).sort()[0], en=r.items.map(i=>i.end).filter(Boolean).sort().pop();
  const ph=phasesOf(r);
  L.push(`■ ${roomName(r.room)} 치료기록  ${dateLabel(r.date)}  [${r.visit||'외래'}${r.ins&&r.ins!=='건강보험'?'·'+r.ins:''}]`);
  L.push(`환자: ${r.regNo} ${r.name}`);
  L.push(`처방의: ${r.doctor||'(미입력)'}   시행자: ${r.therapist||'(미입력)'}`);
  if(r.dx) L.push(`Dx(상병): ${r.dx}`);
  const site=siteText(r); if(site) L.push(`Site(부위): ${site}${r.ins==='자보'&&siteCount(r)>=2?` (${siteCount(r)}부위 동시 시행)`:''}`);
  if(st) L.push(`치료시간: ${hm(st)} ~ ${en?hm(en):'진행 중'}${en?` (총 ${mins(st,en)}분${ph.length>1?', 순차 시행':r.items.length>1?', 동시 시행':''})`:''}`);
  L.push('Tx(치료방법·조건):');
  r.items.forEach((it,idx) => {
    const m=MOD(it.mid)||{name:it.mid, fields:[]}; const p=paramsOf(it);
    const time = it.start ? `${hm(it.start)}~${it.end?hm(it.end):''}${it.end?` (${mins(it.start,it.end)}분)`:''}` : '';
    L.push(` ${idx+1}) ${m.name}${m.en?` ${m.en}`:''}${sc&&m.code?` [${m.code}]`:''}${m.coverage==='비급여'?' (비급여)':''}  ${time}`);
    if(m.format==='simple'){
      const types=(p.types||[]); if(types.length) L.push(`    시행운동: ${types.join(' & ')}`);
      if(site) L.push(`    부위: ${site}`);
      L.push(`    소요시간: ${it.start&&it.end?mins(it.start,it.end):it.min}분`);
      if(p.note) L.push(`    특이사항: ${p.note}`);
      for(const [k,lb] of [['s','[S]'],['o','[O]'],['a','[A]'],['p','[P]']]) if(p[k]) L.push(`    ${lb} ${p[k]}`);   // 이전 형식으로 쓴 기록
    } else if(m.format==='soap'){
      if(p.s) L.push(`    [S] ${p.s}`);
      if(p.o) L.push(`    [O] ${p.o}`);
      if(p.a) L.push(`    [A] ${p.a}`);
      const pl=[(p.types||[]).length?`${(p.types||[]).join(', ')} 시행`:'', p.p].filter(Boolean).join(' / ');
      if(pl) L.push(`    [P] ${pl}`);
    } else if(m.format==='manual'){
      if(site) L.push(`    [시행부위] ${site}`);
      const tech=[...(p.tech||[])]; if(tech.length||p.techEtc) L.push(`    [시행기법] ${[tech.join(', '), p.techEtc].filter(Boolean).join(' / ')}`);
      if((p.goal||[]).length) L.push(`    [치료목적] ${p.goal.join(', ')}`);
      if(p.eval) L.push(`    [치료 후 평가] ${p.eval}`);
    } else {
      const line=fillTpl(m.tpl||'', p); if(line) L.push(`    - ${line}`);
    }
  });
  const pre=[...(r.pre?.phrases||[]), r.pre?.text].filter(Boolean).join(', ');
  const preN=r.pre?.nrs, postN=r.post?.nrs;
  const during=[...(r.during?.phrases||[]), r.during?.text].filter(Boolean).join(', ');
  const post=[...(r.post?.phrases||[]), r.post?.text].filter(Boolean).join(', ');
  L.push('Prog. Note(경과):');
  L.push(` - 치료 전: ${pre||'(미입력)'}${preN!==''&&preN!=null?` (NRS ${preN})`:''}`);
  L.push(` - 치료 중: ${during||'(미입력)'}`);
  L.push(` - 치료 후: ${post||'(미입력)'}${(postN!==''&&postN!=null)?` (${nrsText(preN,postN)})`:''}`);
  return L.join('\n');
}
const emrOf = r => r.emrOverride || genEmr(r);

/** 치료 전·후 상태가 비어 있으면 고정 문구로 채움 */
function fillFixed(r){
  const pre=S.settings.fixedPre, post=S.settings.fixedPost;
  if(pre && !(r.pre?.phrases?.length || r.pre?.text)) r.pre={...(r.pre||{}), phrases:[pre]};
  if(post && !(r.post?.phrases?.length || r.post?.text)) r.post={...(r.post||{}), phrases:[post]};
  return r;
}

/* ===================== 산정기준 점검 ===================== */
function checkRecord(r, strict){
  const warn=[], err=[];
  if(!r.regNo) err.push('등록번호를 입력하세요.');
  if(!r.name) err.push('이름을 입력하세요.');
  if(strict){
    if(!r.doctor) err.push(S.settings.doctors.length?'처방의를 선택하세요. (기록지 필수 기재사항)':'처방의 명단이 비어 있습니다 — [설정]에서 먼저 입력하세요.');
    else if(!S.settings.doctors.includes(r.doctor)) err.push(`처방의 '${r.doctor}'은(는) 설정 명단에 없습니다 — 다시 선택하세요.`);
    if(!r.therapist) err.push(S.settings.therapists.length?'시행자를 선택하세요. (기록지 필수 기재사항)':'시행자 명단이 비어 있습니다 — [설정]에서 먼저 입력하세요.');
    else if(!S.settings.therapists.includes(r.therapist)) err.push(`시행자 '${r.therapist}'은(는) 설정 명단에 없습니다 — 다시 선택하세요.`);
    if(!siteText(r)) err.push('치료 부위를 입력하세요.');
    if(!(r.pre?.phrases?.length||r.pre?.text)) err.push('치료 전 상태를 입력하세요.');
    if(!(r.post?.phrases?.length||r.post?.text)) err.push('치료 후 상태를 입력하세요.');
  }
  if(r.ins==='자보' && siteCount(r)<2) (strict?err:warn).push('자보 환자는 두 부위 동시 시행 — 치료 부위를 2개 선택하세요.');
  if(r.ins && r.ins!=='건강보험'){
    for(const it of r.items){ const m=MOD(it.mid); const actual=it.start&&it.end?mins(it.start,it.end):null;
      if(strict && !it.end) err.push(`${m?.name||it.mid}: 종료 시각이 없습니다.`);
      if(strict) for(const f of (m&&m.fields)||[]) if(f.req){ const v=paramsOf(it)[f.k]; if(v==null||v===''||(Array.isArray(v)&&!v.length)) err.push(`${m.name}: '${f.label}' 입력 필요`); } }
    return {warn, err};   // 자보·산재·일반은 건강보험 산정 경고 생략
  }
  const others = S.records.filter(o=>o.id!==r.id && o.regNo===r.regNo && o.date===r.date && !['cancelled','waiting','hold'].includes(o.status));
  const mine = r.items.map(i=>i.mid), theirs = others.flatMap(o=>o.items.map(i=>i.mid));
  const all = new Set([...mine, ...theirs]);
  const has = g => [...all].some(id => MOD(id)?.group===g);
  if(has('heat') && has('cold')) warn.push('온열치료(표층열)와 한냉치료를 같은 날 실시하면 한 가지만 산정됩니다.');
  if(all.has('simpleEx') && all.has('complexEx')) warn.push('단순운동치료와 복합운동치료를 동시에 실시하면 주된 항목만 산정됩니다.');
  for(const it of r.items){
    const m=MOD(it.mid); if(!m) continue;
    if(m.dailyOnce){
      const cnt = theirs.filter(x=>x===it.mid).length;
      if((r.visit||'외래')==='외래' && cnt>=1) warn.push(`${m.name}: 외래는 1일 1회만 산정 — 오늘 이미 ${cnt}건 기록이 있습니다.`);
      if(r.visit==='입원' && cnt>=2) warn.push(`${m.name}: 입원은 1일 2회까지만 산정 — 오늘 이미 ${cnt}건 기록이 있습니다.`);
    }
    const actual = it.start&&it.end ? mins(it.start,it.end) : null;
    if(m.minReq && (actual ?? it.min) < m.minReq) warn.push(`${m.name}: ${m.minReq}분 이상 실시해야 산정됩니다. (현재 ${actual ?? it.min}분)`);
    if(actual!=null && actual < it.min-2 && !m.autoStop) warn.push(`${m.name}: 실제 ${actual}분 — 설정 ${it.min}분보다 짧습니다. 사유가 있으면 경과에 기록하세요.`);
    if(strict){
      for(const f of m.fields||[]) if(f.req){ const v=paramsOf(it)[f.k]; if(v==null||v===''||(Array.isArray(v)&&!v.length)) err.push(`${m.name}: '${f.label}' 입력 필요`); }
      if(!it.end) err.push(`${m.name}: 종료 시각이 없습니다.`);
    }
  }
  return {warn, err};
}

/* ===================== 서버 통신 ===================== */
function setSync(state, text){ const el=$('#sync'); el.className='sync '+(state||''); el.querySelector('span').textContent=text; }
async function run(p, label){
  S.busy++; setSync('busy', label||'저장 중…');
  try{ const r=await p; S.lastErr=null; return r; }
  catch(e){
    // 연결 문제일 때만 '연결 확인' 안내. 그 밖의 오류는 실제 원인을 그대로 보여준다
    S.lastErr = e && e.network ? e : null;
    const hint = e && e.network ? (IS_SERVER ? ' — 메인 PC 프로그램(검은 창)이 켜져 있는지, 같은 와이파이인지 확인하세요.' : ' — 인터넷 연결을 확인하고 다시 시도하세요.') : '';
    toast('⚠️ '+(e.message||e)+hint, '', 7000); throw e;
  }
  finally{ S.busy--; if(!S.busy) setSync(S.lastErr?'err':'', S.lastErr?(IS_SERVER?'메인 PC 연결 끊김':'연결 오류'):SYNC_OK); }
}
async function saveRecord(rec, {quiet}={}){
  const base = rec._base; const out = clone(rec); delete out._base;
  if(!['done','cancelled'].includes(out.status)){   // 완료·취소된 예전 기록은 그대로 보존
    if(out.doctor && !S.settings.doctors.includes(out.doctor)) out.doctor='';
    if(out.therapist && !S.settings.therapists.includes(out.therapist)) out.therapist='';
  }
  S.writeSeq = (S.writeSeq||0) + 1;
  out.updatedAt = nowIso(); out.updatedBy = S.local.device || '';
  out.emrText = ['ended','done'].includes(out.status) ? emrOf(out) : '';
  const i = S.records.findIndex(r=>r.id===out.id);
  if(out.date===S.date){ if(i>=0) S.records[i]=out; else S.records.push(out); }
  render();
  const res = await run(Store.save(out, base, S.local.device||''));
  if(res.conflict){
    toast('다른 기기에서 먼저 수정된 기록입니다. 최신 내용으로 다시 불러왔습니다.');
    const j=S.records.findIndex(r=>r.id===out.id); if(j>=0) S.records[j]=res.record; render(); return null;
  }
  if(!quiet) S.version=null;
  return res.record;
}
const withBase = r => ({...clone(r), _base:r.updatedAt});
async function refresh(force){
  if(S.busy && !force) return;
  const seq = S.writeSeq||0;
  try{
    const res = await Store.poll(S.date, force?null:S.version);
    // 조회하는 동안 이 기기에서 저장이 있었다면 옛 상태이므로 버리고 다음 주기에 다시 받음
    if(seq !== (S.writeSeq||0) || S.busy){ S.version=null; return; }
    if(res.same){ setSync('', SYNC_OK); return; }
    if(res.settings) S.settings = mergeSettings(res.settings);
    S.records = res.records||[]; S.version = res.version;
    setSync('', SYNC_OK);
    if(drag && drag.on){ S.version=null; return; }   // 끌기 중에는 화면을 다시 그리지 않고 다음 주기에 반영
    if(S.tab==='board' || (S.tab==='ledger' && S.ledgerDate===S.date && !$$('.sel:checked').length)) render();
  }catch(e){ setSync('err', IS_SERVER?'메인 PC 연결 끊김 — 재시도 중':'연결 오류 — 재시도 중'); }
}

/* ===================== 알림 ===================== */
let actx=null;
function unlockAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(actx&&actx.state==='suspended') actx.resume(); }
function beep(){
  if(!S.local.sound || !actx) return;
  const t=actx.currentTime;
  [0,0.35,0.7].forEach((d,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=i===2?1175:880; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001,t+d); g.gain.exponentialRampToValueAtTime(0.35,t+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.28); o.start(t+d); o.stop(t+d+0.3); });
}
function speak(text){
  if(!S.local.voice || !window.speechSynthesis) return;
  try{ const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=1; speechSynthesis.speak(u); }catch(e){}
}
function toast(msg, cls, ms=3500){
  const d=document.createElement('div'); d.textContent=msg; if(cls) d.className=cls; $('#toast').appendChild(d);
  setTimeout(()=>d.remove(), ms);
}
function checkAlarms(){
  const now=Date.now();
  for(const r of S.records){
    if(r.status!=='running' || !r.items.length) continue;
    const ph=phasesOf(r), lp=lastPhase(r);
    // 중간: 앞 순서가 끝나고 다음 치료를 시작할 때
    for(let k=0;k<ph.length-1;k++){
      const e=phaseEnd(r,ph[k]); const key=`${r.id}:next:${ph[k]}:${e}`;
      if(e!=null && now>=e && !S.alarmed.has(key)){
        S.alarmed.add(key); if(now-e>60000) continue;
        const nxt=r.items.filter(i=>i.phase===ph[k+1]).map(i=>MOD(i.mid)?.en||MOD(i.mid)?.name).join('·');
        toast(`⏰ ${roomName(r.room)} ${bedLabel(r)} 베드 → ${nxt} 시작`, 'alarm', 8000); beep(); speak(`${bedLabel(r)} 베드, 다음 치료 시작입니다.`);
      }
    }
    // 마지막: 치료 종료, 2분 초과
    const e=phaseEnd(r,lp); if(e==null) continue;
    for(const [th, tag] of [[0,'0'],[120000,'2']]){
      const key=`${r.id}:end:${e}:${tag}`;
      if(now>=e+th && !S.alarmed.has(key)){
        S.alarmed.add(key); if(now-(e+th)>60000) continue;   // 오래전에 지난 알람(화면 새로 연 경우)은 소리 생략
        const names=r.items.filter(i=>i.phase===lp).map(i=>MOD(i.mid)?.en||MOD(i.mid)?.name).join('·');
        toast(`⏰ ${roomName(r.room)} ${bedLabel(r)} 베드 ${names} 치료 종료${tag==='2'?' (2분 경과)':''}`, 'alarm', 8000); beep(); speak(`${bedLabel(r)} 베드, 치료 종료 시간입니다.`);
      }
    }
  }
}

function applyBrand(){

/** 종료를 잘못 누른 기록(작성 대기)을 다시 치료 중으로 — bed 생략 시 원래 베드, 차 있으면 빈 베드 고르기 */
async function resumeRec(rec, bed){
  if(!rec || rec.status!=='ended'){ toast('작성 대기 상태인 기록만 다시 올릴 수 있습니다.'); return; }
  if(rec.date!==S.date){ toast('오늘 치료만 다시 올릴 수 있습니다. 지난 기록은 [작성]에서 시각을 고치세요.'); return; }
  const free=freeBeds(rec.room);
  if(bed==null){
    if(free.includes(+rec.bed)) bed=+rec.bed;
    else {
      openDlg(`<div class="dlg-h"><h2>${esc(rec.regNo)} ${esc(rec.name)} — 치료 재개</h2><span class="grow"></span><button class="btn sm" data-act="close">닫기</button></div>
      <div class="dlg-b"><p class="small muted" style="margin:0">원래 ${bedLabel(rec)}번 베드는 지금 사용 중입니다. 다시 올릴 빈 베드를 고르세요.</p>
      <div class="chips">${free.map(b=>`<button type="button" class="chip" data-act="resumeTo" data-id="${rec.id}" data-bed="${b}">${rec.room==='ex'?'특'+b:b+'번'}</button>`).join('')||'<span class="small muted">빈 베드 없음</span>'}</div></div>`);
      return;
    }
  }
  if(!free.includes(+bed)){ toast('⛔ 이미 사용 중인 베드입니다.', 'alarm'); return; }
  const r=withBase(rec);
  r.items = rec.resume?.items ? clone(rec.resume.items) : r.items.map(i=>({...i, end:null}));
  delete r.resume; r.status='running'; r.endAt=null; r.bed=+bed;
  schedule(r); r.startAt=r.items.map(i=>i.start).filter(Boolean).sort()[0]||r.startAt;
  closeDlg(); await saveRecord(r);
  toast(`↩ ${bedLabel(r)} 베드 ${r.name} 치료를 다시 진행합니다.`);
}
/** 같은 치료실의 빈 베드(치료 중·준비 중 아닌) */
function freeBeds(roomId){
  const room=S.settings.rooms.find(x=>x.id===roomId); if(!room) return [];
  const used=new Set(S.records.filter(x=>['running','hold'].includes(x.status) && x.date===S.date && x.room===roomId).map(x=>+x.bed));
  return bedNums(room).filter(b=>!used.has(b));
}

function tick(){
  const now=Date.now(); $('#clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  for(const r of S.records){
    if(r.status!=='running') continue;
    const el=document.querySelector(`[data-timer="${r.id}"]`); if(!el) continue;
    const rem=recRemain(r,now); const card=el.closest('.tile');
    el.textContent = rem==null?'--:--':(rem>=0?fmtClock(rem):'초과 '+fmtClock(rem));
    // 순서가 바뀌면(레이저 시작 등) 카드의 '지금 치료' 표시 갱신
    if(card.dataset.phase!==String(curPhase(r,now))){ render(); return; }
    card.classList.toggle('soon', rem!=null && rem>0 && rem<=60000);
    card.classList.toggle('over', rem!=null && rem<=0);
    const bar=document.querySelector(`[data-bar="${r.id}"]`); if(bar) bar.style.width=(recProgress(r,now)*100).toFixed(1)+'%';
  }
  checkAlarms();
}

        <td class="small">${(m.fields||[]).map(f=>esc(f.label)+(f.req?' <b style="color:var(--bad)">*</b>':'')+(f.def?` <span class="muted">(${esc(f.def)})</span>`:'')+(f.hint?` <span class="muted">— ${esc(f.hint)}</span>`:'')).join('<br>')}</td>

      <button class="btn sm" data-act="presetMove" data-room="${room.id}" data-i="${i}" data-d="1" ${i<list.length-1?'':'disabled'} title="아래로">↓</button>
      <button class="btn sm" data-act="presetEdit" data-room="${room.id}" data-i="${i}">수정</button>
      <button class="btn sm bad" data-act="presetDel" data-room="${room.id}" data-i="${i}">✕</button></div>`).join('')||'<div class="small muted">없음</div>'}</div></div>`; }).join('')}</div>`;

/** 빠른 선택 저장 (다른 설정 입력칸은 건드리지 않도록 이 목록만 저장) */
async function savePresets(room, list){
  const presets = clone(S.settings.presets || PRESETS);
  presets[room] = list;
  const s = {...clone(S.settings), presets};
  await run(Store.saveSettings(s)); S.settings = mergeSettings(s);
  const panel=$('#presetPanel'); if(panel) panel.innerHTML=presetPanelHtml();
}
function openPresetEditor(room, i){

/** 대화상자의 체크·시간·순서 → 빠른 선택 한 개 */
function readPresetFrom(box){
  const items=[], min={}, order={};
  for(const el of $$('.mod', box)){ if(!$('[data-on]',el).checked) continue; const id=el.dataset.mod; items.push(id);
    const v=parseInt($('[data-min]',el).value); if(v && v!==MOD(id)?.min) min[id]=v;
    const o=$('[data-order]',el)?.value; if(o) order[id]=o; }
  return {items, min, order};
}

function modEditor(m, it, withTime){

function acItemHtml(p, q, i){
  const reg=String(p.regNo), hit=reg.startsWith(q)?`<u>${esc(reg.slice(0,q.length))}</u>${esc(reg.slice(q.length))}`:esc(reg);
  const last=p.last?`${esc(String(p.last.date||'').slice(5))} · ${esc((p.last.items||[]).map(id=>MOD(id)?.en||id).join('+'))}`:'기록 없음';
  return `<button type="button" data-i="${i}"><b>${hit}</b> ${esc(p.name||'')} <span class="small muted">최근 ${last}</span>${p.memo?` <span class="small" style="color:var(--warn)">· ${esc(p.memo)}</span>`:''}</button>`;
}
function bindAutocomplete(input, list, onPick){
  let t=null, rs=[], cur=-1;
  const show=()=>{ $$('button',list).forEach((b,i)=>b.classList.toggle('on', i===cur)); };
  const pick=i=>{ list.hidden=true; if(rs[i]) onPick(rs[i]); };
  input.addEventListener('input', ()=>{
    clearTimeout(t); const q=input.value.trim(); if(!q){ list.hidden=true; return; }
    t=setTimeout(async ()=>{
      let r=[]; try{ r=await Store.findPatients(q); }catch(e){}
      if(input.value.trim()!==q) return;
      rs=r; cur=r.length?0:-1;
      list.innerHTML=r.map((p,i)=>acItemHtml(p,q,i)).join('');
      list.hidden=!r.length; show();
      list.onmousedown=e=>{ const b=e.target.closest('button'); if(b){ e.preventDefault(); pick(+b.dataset.i); } };
    },150);
  });
  input.addEventListener('keydown', e=>{
    if(list.hidden || !rs.length) return;
    if(e.key==='ArrowDown'){ e.preventDefault(); cur=(cur+1)%rs.length; show(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); cur=(cur-1+rs.length)%rs.length; show(); }
    else if(e.key==='Enter' && cur>=0){ e.preventDefault(); e.stopPropagation(); pick(cur); }
    else if(e.key==='Escape'){ list.hidden=true; }
  });
  input.addEventListener('blur', ()=>setTimeout(()=>list.hidden=true,200));
}
async function doStart(bed, wid){
  const d=$('#dlg');
  const regNo=$('#sRegNo').value.trim(), name=$('#sName').value.trim();
  const items=$$('#sMods .mod').filter(el=>$('[data-on]',el).checked).map(el=>{
    const mid=el.dataset.mod, m=MOD(mid);
    const defs = Object.fromEntries((m.fields||[]).filter(f=>f.def!=null).map(f=>[f.k,f.def]));
    const params = isFixed(m) ? defs : Object.assign(defs, d._params[mid]||{});
    // 서술형(S·O·A·P, 평가)은 매번 새로 쓰도록 이전 값을 가져오지 않음
    for(const f of m.fields||[]) if(f.type==='textarea') delete params[f.k];
    // 순서: 기본은 항목별 고정(레이저는 IR·ICT 후), 단순운동 등은 '먼저/이어서' 선택
    const ord=$('[data-order]',el)?.value; const phase = ord==='before' ? 0 : ord==='after' ? 3 : m.phase;
    return {mid, min:Math.max(1,parseInt($('[data-min]',el).value)||m.min), phase, params, start:null, end:null};
  });
  const errs=[]; if(!regNo) errs.push('등록번호'); if(!name) errs.push('이름'); if(!items.length) errs.push('치료 항목');
  if(items.length>1 && items.some(i=>MOD(i.mid)?.solo)){ $('#sWarn').innerHTML='<div class="errbox">충격파(비급여)는 다른 치료와 따로 기록합니다. 충격파만 선택해 시작하세요.</div>'; return; }
  if(errs.length){ $('#sWarn').innerHTML=`<div class="errbox">${errs.join(', ')}을(를) 입력하세요.</div>`; return; }
  if(S.records.some(r=>['running','hold'].includes(r.status) && r.id!==wid && r.date===S.date && r.room===S.room && +r.bed===+bed)){ $('#sWarn').innerHTML='<div class="errbox">이미 사용 중이거나 다른 사람이 준비 중인 베드입니다.</div>'; return; }
  if(S.records.some(r=>r.status==='running' && r.regNo===regNo) && !confirm('이 환자는 다른 베드에서 치료 중입니다. 계속할까요?')) return;
  const t=setTime(nowIso(), $('#sStart').value||hm(nowIso()));
  const first=Math.min(...items.map(i=>i.phase)); items.forEach(i=>{ if(i.phase===first) i.start=t; });

function collectEdit(){
  const d=$('#dlg'); const r=clone(d._rec);
  r.regNo=$('#eRegNo').value.trim(); r.name=$('#eName').value.trim(); r.visit=$('#eVisit').value; r.ins=$('#eIns').value;
  r.doctor=$('#eDoctor').value; r.therapist=$('#eTher').value; r.dx=$('#eDx').value.trim();
  r.side=$('#eSide .on')?.dataset.side||''; r.sites=readChips($('#eSites')); r.siteEtc=$('#eSiteEtc').value.trim();
  for(const it of r.items){
    const box=$(`[data-emod="${it.mid}"]`); if(!box) continue;
    for(const el of $$('[data-p]',box)){ it.params[el.dataset.k] = el.dataset.multi ? readChips(el) : el.value.trim(); }
    const ts=$('[data-t=start]',box), te=$('[data-t=end]',box);
    if(ts&&ts.value&&it.start) it.start=setTime(it.start, ts.value);
    if(te&&it.start){ it.end = te.value ? setTime(it.start, te.value) : (r.status==='running'?it.end:null); if(it.end && it.end<it.start) it.end=it.start; }
  }
  if(r.status==='running'){ schedule(r); }
  if(r.status==='running' && r.date!==S.date && r.items.every(i=>i.end)) r.status='ended';
  if(r.status!=='running') finalizeTimes(r); else r.startAt=r.items.map(i=>i.start).filter(Boolean).sort()[0]||r.startAt;
  r.pre={phrases:readChips($('#ePre')), nrs:d._rec.pre?.nrs||'', text:$('#ePreT').value.trim()};
  r.during={phrases:readChips($('#eDur')), text:$('#eDurT').value.trim()};
  r.post={phrases:readChips($('#ePost')), nrs:d._rec.post?.nrs||'', text:$('#ePostT').value.trim()};
  r.emrDone=$('#eEmrDone').checked;
  r.emrOverride = d._override ? $('#eEmr').value : '';
  return r;
}
// 확인 창 (예/아니오). body 는 HTML
function askConfirm(title, body, okLabel='확인', okClass='pri'){
  return new Promise(resolve=>{
    const c=$('#cfm');
    c.innerHTML=`<div class="dlg-h"><h2>${esc(title)}</h2></div><div class="dlg-b">${body}</div>
      <div class="dlg-f"><button class="btn" data-cfm="0">취소</button><button class="btn ${okClass}" data-cfm="1">${esc(okLabel)}</button></div>`;
    // 확인 시 창 안 입력값을 {id: 값} 으로 돌려줌 (취소는 false)
    const done=v=>{ const vals=Object.fromEntries([...c.querySelectorAll('input[id],textarea[id]')].map(i=>[i.id,i.value])); c.close(); c.innerHTML=''; resolve(v?vals:false); };
    c.onclick=e=>{ const b=e.target.closest('[data-cfm]'); if(b) done(b.dataset.cfm==='1'); };
    c.oncancel=e=>{ e.preventDefault(); done(false); };
    c.showModal(); setTimeout(()=>c.querySelector('[data-cfm="1"]')?.focus(),30);
  });
}
async function saveEdit(done){
  const r=collectEdit(); const {err, warn}=checkRecord(r, done);
  if(done){
    const li = a => `<ul style="margin:4px 0 0;padding-left:18px">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    const head = `<p style="margin:0"><b>${esc(r.regNo)} ${esc(r.name)}</b> · ${esc(modNames(r))}</p>`;
    const ok = err.length
      ? await askConfirm('부족한 사항이 있습니다', head+`<div class="errbox"><b>부족한 사항 ${err.length}건</b>${li(err)}</div>`+(warn.length?`<div class="warnbox"><b>산정기준 점검</b>${li(warn)}</div>`:'')+'<p style="margin:0">부족한 상태로 제출하시겠습니까?</p>', '그래도 제출', 'bad')
      : await askConfirm('작성 완료 처리', head+(warn.length?`<div class="warnbox"><b>산정기준 점검</b>${li(warn)}</div>`:'')+'<p style="margin:0">작성 완료로 처리하시겠습니까?<br><span class="small muted">기록문이 복사되니 EMR에 붙여넣으세요.</span></p>', '작성 완료', 'ok');
    if(!ok){ if(err.length) $('#eChecks').scrollIntoView({behavior:'smooth'}); return; }
    if(err.length) r.incomplete = err; else delete r.incomplete;
  }
  if(done){ r.status='done'; delete r.resume; await copyText(emrOf(r)); }
  else if(r.status==='done' && checkRecord(r,true).err.length) r.status='ended';
  r._base=$('#dlg')._rec._base;
  const saved = await saveRecord(r);
  if(saved){ closeDlg(); toast(done?(r.incomplete?'부족한 사항이 있는 채로 제출했습니다 — 기록문 복사됨':'작성 완료 — 기록문이 복사되었습니다. EMR에 붙여넣으세요.'):'저장했습니다.'); if(S.tab==='patient'&&S.patientView?.regNo) loadPatientView(S.patientView.regNo); if(S.tab==='ledger'&&S.ledgerDate!==S.date) loadLedger(); }
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){ const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; ($('#dlg').open?$('#dlg'):document.body).appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(_){} ta.remove(); if(!ok) toast('복사 실패 — 기록문을 직접 선택해 복사하세요.'); return ok; }
}
function csvOf(rows){
  const H=['날짜','등록번호','이름','구분','치료실','베드','치료항목','코드','시작','종료','소요(분)','처방의','시행자','부위','상태','EMR입력','기록문'];
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const lines=[H.map(q).join(',')];
  for(const r of rows.filter(r=>!['waiting','hold'].includes(r.status))) lines.push([r.date,r.regNo,r.name,r.visit,roomName(r.room),r.bed,modNames(r),r.items.map(i=>MOD(i.mid)?.code).join('+'),hm(r.startAt),r.endAt?hm(r.endAt):'',r.startAt&&r.endAt?mins(r.startAt,r.endAt):'',r.doctor,r.therapist,siteText(r),({running:'치료중',ended:'작성대기',done:'작성완료',cancelled:'취소'})[r.status]||r.status,r.emrDone?'Y':'',emrOf(r)].map(q).join(','));
  return '﻿'+lines.join('\r\n');
}
function download(name, text, type='text/csv;charset=utf-8'){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}

/* ===================== 끌어서 옮기기 =====================
 * 치료 중인 베드 → 빈 베드: 베드 이동 / 대기 환자 → 빈 베드: 치료 시작 창
 * 치료 중·준비 중 베드에 놓으면 안내만. 마우스는 바로 끌기, 터치는 길게 눌러(0.3초) 끌기 (스크롤과 구분) */
let drag=null, suppressClick=false;
function dragInfo(){
  if(!drag) return null;
  if(drag.kind==='rec'){ const r=S.records.find(x=>x.id===drag.id); return r&&r.status==='running'?{label:`${bedLabel(r)} ${r.name}`, room:r.room, rec:r}:null; }
  if(drag.kind==='ended'){ const r=S.records.find(x=>x.id===drag.id); return r&&r.status==='ended'&&r.date===S.date?{label:`↩ ${r.name}`, room:r.room, rec:r}:null; }
  const w=S.records.find(x=>x.id===drag.id); return w&&w.status==='waiting'?{label:w.name, room:null, rec:w}:null;
}
function dropCheck(tile, info){
  if(!tile || !info) return null;
  const room=tile.dataset.room, bed=+tile.dataset.bed, no=room==='ex'?`특수 ${bed}번`:`${bed}번`;
  if(drag.kind==='rec' && tile.dataset.rid===drag.id) return {ok:false, silent:true};
  if(info.room && room!==info.room) return {ok:false, msg:'다른 치료실 베드로는 옮길 수 없습니다.'};
  if(tile.classList.contains('run')) return {ok:false, msg:`${no} 베드는 치료 중이라 ${drag.kind!=='wait'?'이동':'배정'}할 수 없습니다.`};
  if(tile.classList.contains('hold')) return {ok:false, msg:`${no} 베드는 다른 분이 준비 중(찜)이라 ${drag.kind!=='wait'?'이동':'배정'}할 수 없습니다.`};
  if(tile.classList.contains('empty')) return {ok:true, room, bed};
  return null;
}
function dragStartVisual(){
  const info=dragInfo(); if(!info){ drag=null; return; }
  drag.on=true; document.body.classList.add('dragging', 'drag-'+(info.room||'any'));
  drag.src?.classList.add('drag-src');
  const g=document.createElement('div'); g.id='dragGhost'; g.textContent=info.label; document.body.appendChild(g); drag.ghost=g;
  if(navigator.vibrate) try{ navigator.vibrate(15); }catch(e){}
}
function dragEnd(){
  if(!drag) return;
  clearTimeout(drag.timer); drag.ghost?.remove(); document.body.classList.remove('dragging','drag-pt','drag-ex','drag-any');
  $$('.drop-ok,.drop-no,.drag-src').forEach(el=>el.classList.remove('drop-ok','drop-no','drag-src'));
  drag=null;
}
document.addEventListener('pointerdown', ev=>{
  if(ev.button!==0 || S.tab!=='board') return;
  const t=ev.target.closest('.tile.run[data-rid] .tile-body'), w=ev.target.closest('[data-act=pick]'), en=ev.target.closest('[data-drag-ended]');
  if(!t && !w && !en) return;
  if(en){ drag={kind:'ended', id:en.dataset.dragEnded, x:ev.clientX, y:ev.clientY, on:false, touch:ev.pointerType!=='mouse', src:en.closest('.item')};
    if(drag.touch) drag.timer=setTimeout(()=>{ if(drag && !drag.on){ drag.armed=true; dragStartVisual(); } }, 300); return; }
  drag={kind:t?'rec':'wait', id:t?t.closest('.tile').dataset.rid:w.dataset.id, x:ev.clientX, y:ev.clientY, on:false, touch:ev.pointerType!=='mouse', src:t?t.closest('.tile'):w.closest('.item')};
  if(drag.touch) drag.timer=setTimeout(()=>{ if(drag && !drag.on){ drag.armed=true; dragStartVisual(); } }, 300);
});
document.addEventListener('pointermove', ev=>{
  if(!drag) return;
  const moved=Math.hypot(ev.clientX-drag.x, ev.clientY-drag.y);
  if(!drag.on){
    if(drag.touch){ if(moved>8) dragEnd(); return; }   // 길게 누르기 전에 움직이면 스크롤로 보고 취소
    if(moved<6) return; dragStartVisual(); if(!drag) return;
  }
  drag.ghost.style.left=ev.clientX+'px'; drag.ghost.style.top=ev.clientY+'px';
  $$('.drop-ok,.drop-no').forEach(el=>el.classList.remove('drop-ok','drop-no'));
  const tile=document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.tile');
  const c=dropCheck(tile, dragInfo()); if(c && !c.silent) tile.classList.add(c.ok?'drop-ok':'drop-no');
});
// 터치: 드래그 중에는 화면 스크롤 막기
document.addEventListener('touchmove', ev=>{ if(drag && drag.on) ev.preventDefault(); }, {passive:false});
document.addEventListener('pointercancel', ()=>{ if(drag && !drag.on) dragEnd(); });
document.addEventListener('pointerup', async ev=>{
  if(!drag) return;
  if(!drag.on){ dragEnd(); return; }
  const info=dragInfo(), kind=drag.kind;
  const tile=document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.tile');
  const c=dropCheck(tile, info);
  suppressClick=true; setTimeout(()=>suppressClick=false, 50);
  dragEnd();
  if(!c || c.silent) return;
  if(!c.ok){ toast('⛔ '+c.msg, 'alarm', 3500); return; }
  if(kind==='ended'){ await resumeRec(info.rec, c.bed); return; }
  if(kind==='rec'){
    if(!freeBeds(c.room).includes(c.bed)){ toast('⛔ 방금 다른 기기에서 사용하기 시작한 베드입니다.', 'alarm'); return; }
    const r=withBase(info.rec); const from=bedLabel(r); r.bed=c.bed; await saveRecord(r); toast(`${from} → ${bedLabel(r)} 베드로 옮겼습니다.`);
  } else {
    S.room=c.room; S.pickWaiting=null; openStart(c.bed, info.rec);
  }
});
// 끌기를 마친 직후의 클릭(베드 메뉴 열림 등)은 무시
document.addEventListener('click', ev=>{ if(suppressClick){ ev.stopPropagation(); ev.preventDefault(); suppressClick=false; } }, true);
document.addEventListener('click', async ev=>{
  const chip=ev.target.closest('[data-chip]'); if(chip){ chip.classList.toggle('on'); const d=$('#dlg'); if(d._upd) d._upd(); return; }
  const side=ev.target.closest('[data-side]'); if(side){ $$('[data-side]', side.parentElement).forEach(b=>b.classList.toggle('on',b===side)); $('#dlg')._upd?.(); return; }
  const t=ev.target.closest('[data-tab]'); if(t){ S.tab=t.dataset.tab; if(S.tab==='ledger'&&S.ledgerDate!==S.date) loadLedger(); render(); return; }
  const a=ev.target.closest('[data-act]'); if(!a) return;
  const act=a.dataset.act, id=a.dataset.id;
  const rec = id && (S.records.find(r=>r.id===id) || (S.ledgerRows||[]).find(r=>r.id===id));
  switch(act){
    case 'close': closeDlg(); break;
    case 'room': S.room=a.dataset.room; S.local.room=S.room; saveLocal(); render(); break;
    case 'bedMenu': if(rec) openBedMenu(rec); break;
    case 'resume': resumeRec(rec); break;
    case 'resumeTo': resumeRec(rec, +a.dataset.bed); break;
    case 'moveBed': {
      const nb=+a.dataset.bed; if(!freeBeds(rec.room).includes(nb)){ toast('이미 사용 중인 베드입니다.'); break; }
      const r=withBase(rec); const from=bedLabel(r); r.bed=nb; closeDlg(); await saveRecord(r); toast(`${from} → ${bedLabel(r)} 베드로 옮겼습니다.`); break; }
    case 'hold': {
      const bed=+a.dataset.bed, roomId=a.dataset.room; if(!freeBeds(roomId).includes(bed)){ toast('이미 사용 중인 베드입니다.'); break; }
      const w=S.pickWaiting && S.records.find(r=>r.id===S.pickWaiting);
      let rec2;
      if(w){ rec2={...withBase(w), status:'hold', room:roomId, bed, fromWaiting:true, holdBy:S.local.device||'', createdAt:w.createdAt}; S.pickWaiting=null; }
      else {
        const v=await askConfirm(`${roomId==='ex'?'특수 '+bed:bed}번 베드 찜 (준비 중)`, `<p class="small muted" style="margin:0">슬립 쓰는 동안 다른 사람이 이 베드에 환자를 넣지 못하게 잡아둡니다. 이름만 적어도 됩니다.</p>
          <div class="grid2"><label class="f"><span>등록번호 (선택)</span><input type="text" id="hReg" inputmode="numeric"></label><label class="f"><span>이름 (선택)</span><input type="text" id="hName"></label></div>`, '찜하기');
        if(!v) break;
        rec2={id:uid(), createdAt:nowIso(), date:S.date, status:'hold', room:roomId, bed, regNo:(v.hReg||'').trim(), name:(v.hName||'').trim(), items:[], holdBy:S.local.device||''};
      }
      await saveRecord(rec2); toast(`${roomId==='ex'?'특수 '+bed:bed}번 베드 준비 중으로 표시했습니다.`); break; }
    case 'unhold': {
      if(!confirm('준비 중 표시를 해제할까요?')) break;
      if(rec.fromWaiting){ const r=withBase(rec); r.status='waiting'; r.bed=null; r.room=''; delete r.fromWaiting; await saveRecord(r); }
      else { S.records=S.records.filter(r=>r.id!==id); render(); await run(Store.remove(rec,'찜 해제',S.local.device||'')); }
      break; }
    case 'startHold': { S.room=rec.room; openStart(+rec.bed, rec); break; }
    case 'waitSite': openWaitSite(rec); break;
    case 'saveWaitSite': {
      const r=withBase(rec); r.ins=$('#wIns').value; r.sites=readChips($('#wSites')); r.side=$('#wSide .on')?.dataset.side||''; r.siteEtc=$('#wSiteEtc').value.trim(); r.memo=$('#wMemo').value.trim();
      closeDlg(); await saveRecord(r); break; }
    case 'emrToggle': { const r=withBase(rec); r.emrDone=!r.emrDone; await saveRecord(r); toast(r.emrDone?`${r.name} EMR 입력 완료`:`${r.name} EMR 입력 취소`); break; }
    case 'copyRec': { if(await copyText(emrOf(rec))) toast(`${rec.name} 기록문을 복사했습니다. EMR에 붙여넣은 뒤 [EMR ✓]를 누르세요.`, '', 5000); break; }
    case 'start': {
      S.room=a.dataset.room||S.room;
      if(!freeBeds(S.room).includes(+a.dataset.bed)){ toast('방금 다른 기기에서 사용하기 시작한 베드입니다.'); break; }
      const w = S.pickWaiting && S.records.find(r=>r.id===S.pickWaiting);
      openStart(+a.dataset.bed, w); break; }
    case 'pick': S.pickWaiting = S.pickWaiting===id?null:id; render(); break;
    case 'pickCancel': S.pickWaiting=null; render(); break;
    case 'unwait': if(confirm('대기 명단에서 삭제할까요?')){ S.records=S.records.filter(r=>r.id!==id); render(); await run(Store.remove(rec,'대기 삭제',S.local.device)); } break;
    case 'preset': $('#dlg')._applyPreset(+a.dataset.i); break;
    case 'presetEdit': openPresetEditor(a.dataset.room, +a.dataset.i); break;
    case 'presetSave': {
      const room=a.dataset.room, i=+a.dataset.i, name=$('#pName').value.trim(), p={name, ...readPresetFrom($('#pMods'))};
      const err = !name ? '이름을 입력하세요.' : !p.items.length ? '치료 항목을 하나 이상 체크하세요.' : (p.items.length>1 && p.items.some(id=>MOD(id)?.solo)) ? '충격파(비급여)는 다른 치료와 함께 묶을 수 없습니다.' : '';
      if(err){ $('#pWarn').innerHTML=`<div class="errbox">${err}</div>`; break; }
      const list=clone(presetsOf(room)); if(i>=0) list[i]=p; else list.push(p);
      closeDlg(); await savePresets(room, list); toast(`빠른 선택 '${name}' 저장`); break; }
    case 'presetDel': { const room=a.dataset.room, i=+a.dataset.i, list=clone(presetsOf(room)); if(!confirm(`'${list[i].name}' 빠른 선택을 삭제할까요?`)) break; list.splice(i,1); await savePresets(room, list); break; }
    case 'presetMove': { const room=a.dataset.room, i=+a.dataset.i, j=i+(+a.dataset.d), list=clone(presetsOf(room)); if(j<0||j>=list.length) break; [list[i],list[j]]=[list[j],list[i]]; await savePresets(room, list); break; }
    case 'presetReset': { if(!confirm('빠른 선택을 기본 목록으로 되돌릴까요? 직접 만든 빠른 선택은 지워집니다.')) break;
      const s={...clone(S.settings)}; delete s.presets; s.presets=null; await run(Store.saveSettings(s)); S.settings=mergeSettings(s); $('#presetPanel').innerHTML=presetPanelHtml(); break; }
    case 'savePresetFromStart': {
      const room=a.dataset.room, p=readPresetFrom($('#sMods'));
      if(!p.items.length){ toast('먼저 치료 항목을 선택하세요.'); break; }
      if(p.items.length>1 && p.items.some(id=>MOD(id)?.solo)){ toast('충격파(비급여)는 다른 치료와 함께 묶을 수 없습니다.'); break; }
      const v=await askConfirm('빠른 선택으로 저장', `<p class="small muted" style="margin:0">${esc(presetSummary(p))}</p><label class="f"><span>이름 (버튼에 표시)</span><input type="text" id="qpName" value="${esc(presetSummary(p).replace(/ \d+분/g,''))}"></label>`, '저장');
      if(!v || !(v.qpName||'').trim()) break;
      const list=clone(presetsOf(room)); list.push({name:v.qpName.trim(), ...p});
      await savePresets(room, list);
      // 시작 창의 빠른 선택 버튼 줄에 바로 반영
      const i=list.length-1, btn=document.createElement('button'); btn.type='button'; btn.className='chip'; btn.dataset.act='preset'; btn.dataset.i=i; btn.textContent=v.qpName.trim(); a.before(btn);
      toast(`빠른 선택 '${v.qpName.trim()}' 추가`); break; }
    case 'allMin': $$('#sMods .mod').forEach(el=>{ if($('[data-on]',el).checked) $('[data-min]',el).value=a.dataset.n; }); break;
    case 'plus': case 'minus': { const inp=$('[data-min]',a.closest('.mod')); inp.value=Math.max(1,(parseInt(inp.value)||0)+(act==='plus'?5:-5)); break; }
    case 'doStart': doStart(+a.dataset.bed, a.dataset.wid); break;
    case 'advance': {
      const r=withBase(rec); const before=clone(r.items); const dropped=finishRec(r, nowIso());
      r.resume={items:before};   // 종료를 잘못 눌렀을 때 [치료 재개]로 되돌리기용
      if(!r.items.length){ toast('시작한 치료가 없어 종료할 수 없습니다. [치료 취소]를 사용하세요.'); break; }
      await saveRecord(r);
      toast(`${bedLabel(r)} 베드 종료 — 경과 기록을 작성하세요.${dropped.length?` (시작 전이던 ${dropped.join('·')} 제외)`:''}`, '', 6000); openEdit(r.id);
      break; }
    case 'extend': { const r=withBase(rec); const p=curPhase(r); r.items.forEach(i=>{ if(i.phase===p&&!i.end) i.min+=5; }); schedule(r); closeDlg(); await saveRecord(r); toast(`${bedLabel(r)} 베드 5분 연장`); break; }
    case 'cancelRun': { const why=prompt('치료 취소 사유 (예: 환자 거부, 잘못 입력)'); if(why===null) break; const r=withBase(rec); r.status='cancelled'; r.cancelReason=why; r.endAt=nowIso(); closeDlg(); await saveRecord(r); break; }
    case 'edit': openEdit(id, a.dataset.date||S.date); break;
    case 'emrReset': { const d=$('#dlg'); d._override=false; $('#eOvNote').textContent=''; a.hidden=true; d._upd(); break; }
    case 'copyEmr': if(await copyText($('#eEmr').value)) toast('기록문을 복사했습니다.'); break;
    case 'saveDraft': saveEdit(false); break;
    case 'saveDone': saveEdit(true); break;
    case 'cancelRec': { const why=prompt('기록 취소 사유'); if(why===null) break; const r=collectEdit(); r._base=$('#dlg')._rec._base; r.status='cancelled'; r.cancelReason=why; if(await saveRecord(r)) closeDlg(); break; }
    case 'paste': openPaste(); break;
    case 'doPaste': doPaste(); break;
    case 'ldPrev': case 'ldNext': S.ledgerDate=shiftDate(S.ledgerDate, act==='ldPrev'?-1:1); if(S.ledgerDate===S.date) render(); else loadLedger(); break;
    case 'ldToday': S.ledgerDate=S.date; render(); break;
    case 'ldFilter': S.ledgerFilter=a.dataset.f; render(); break;
    case 'copySel': {
      const ids=$$('.sel:checked').map(c=>c.value); const rows=(S.ledgerDate===S.date?S.records:S.ledgerRows||[]).filter(r=>ids.includes(r.id) && r.status==='done');
      if(!rows.length){ toast('작성 완료된 기록을 선택하세요.'); break; }
      if(await copyText(rows.map(emrOf).join('\n\n'))) toast(`${rows.length}건 기록문을 복사했습니다.`); break; }
    case 'delSel': {
      const ids=$$('.sel:checked').map(c=>c.value); const rows=(S.ledgerDate===S.date?S.records:S.ledgerRows||[]).filter(r=>ids.includes(r.id));
      if(!rows.length){ toast('삭제할 기록을 선택하세요.'); break; }
      const ok=await askConfirm(`${rows.length}건 삭제`, `<ul style="margin:0;padding-left:18px">${rows.map(r=>`<li>${hm(r.startAt)} ${esc(r.regNo)} ${esc(r.name)} · ${esc(modNames(r))} ${statusTag(r)}</li>`).join('')}</ul>
        <label class="f"><span>삭제 사유 (수정 이력에 남습니다)</span><input type="text" id="delWhy" placeholder="예: 중복 입력, 잘못 입력"></label>
        <p class="small muted" style="margin:0">삭제하면 되돌릴 수 없습니다. ${rows.some(r=>r.status==='running')?'<b>치료 중인 건은 베드가 비워집니다.</b>':''}</p>`, '삭제', 'bad');
      if(!ok) break;
      const why=(ok.delWhy||'').trim() || '대장에서 선택 삭제';
      S.records=S.records.filter(r=>!ids.includes(r.id)); if(S.ledgerRows) S.ledgerRows=S.ledgerRows.filter(r=>!ids.includes(r.id)); render();
      for(const r of rows) await run(Store.remove(r, why, S.local.device||''), '삭제 중…');
      S.version=null; toast(`${rows.length}건 삭제했습니다.`); break; }
    case 'csvOpen': openCsv(); break;
    case 'doCsv': { const f=$('#cFrom').value, to=$('#cTo').value; const rows=await run(Store.listRange(f,to),'불러오는 중…'); download(`치료대장_${f}_${to}.csv`, csvOf(rows.sort((x,y)=>(x.startAt||'').localeCompare(y.startAt||'')))); closeDlg(); break; }
    case 'print': window.print(); break;
    case 'pSearch': { const q=$('#pq').value.trim(); if(!q) break; const rs=await run(Store.findPatients(q),'검색 중…'); const hit=rs.find(p=>p.regNo===q)||(rs.length===1?rs[0]:null); if(hit) loadPatientView(hit.regNo); else if(rs.length){ showPq(rs); } else loadPatientView(q); break; }
    case 'copyOne': { const r=S.patientView.records.find(x=>x.id===id); if(r&&await copyText(emrOf(r))) toast('복사했습니다.'); break; }
    case 'pCsv': download(`환자기록_${S.patientView.regNo}.csv`, csvOf(S.patientView.records)); break;
    case 'pMemoSave': { const v=S.patientView; const p={...(v.patient||{regNo:v.regNo, name:v.records[0]?.name||''}), memo:$('#pMemo').value.trim()}; const res=await run(Store.savePatient(p)); v.patient=res.patient; toast('메모 저장'); break; }
    case 'saveSettings': saveSettingsForm(); break;
    case 'testAlarm': unlockAudio(); setTimeout(()=>{ beep(); speak('1번 베드, 치료 종료 시간입니다.'); toast('⏰ 알람 테스트','alarm'); },100); break;
    case 'setDir': { try{ const r=await run(Store.call('setDataDir', $('#srvDir').value)); toast(r.copied?'데이터 폴더를 바꾸고 기존 데이터를 복사했습니다.':'데이터 폴더를 바꿨습니다.'); S.version=null; refresh(true); loadServerInfo(); }catch(e){} break; }
    case 'findDrive': {
      let c=[]; try{ c=await run(Store.call('findDriveFolders'),'찾는 중…'); }catch(e){ break; }
      const el=$('#driveCands');
      el.innerHTML = c.length ? '→ '+c.map(x=>`<button class="chip" data-act="pickDrive" data-path="${esc(x.target)}">${esc(x.target)}</button>`).join(' ')
        : '<span style="color:var(--bad)">이 PC에서 구글 드라이브 폴더를 찾지 못했습니다. <a href="https://www.google.com/drive/download/" target="_blank" rel="noopener">Google Drive 데스크톱</a>을 설치·로그인하면 탐색기에 G: 드라이브(내 드라이브)가 생깁니다.</span>';
      if(c.length===1) $('#srvDir').value=c[0].target;
      break; }
    case 'pickDrive': $('#srvDir').value=a.dataset.path; break;
    case 'setPin': { const v=$('#srvPin').value.trim(); if(v && !/^\d{4,}$/.test(v) && !confirm('숫자 4자리 이상을 권장합니다. 그대로 저장할까요?')) break; try{ await run(Store.call('setPin', v)); try{ localStorage.setItem('ptrec.pin', v); }catch(e){} toast(v?'PIN을 저장했습니다.':'PIN을 해제했습니다.'); loadServerInfo(); }catch(e){} break; }
    case 'backup': download(`물리치료기록_백업_${ymd()}.json`, localStorage.getItem(DB_KEY)||'{}', 'application/json'); break;
  }
});
document.addEventListener('change', async ev=>{
  if(ev.target.id==='ldDate'){ S.ledgerDate=ev.target.value||S.date; if(S.ledgerDate===S.date) render(); else loadLedger(); }
  if(ev.target.id==='selAll') $$('.sel:not(:disabled)').forEach(c=>c.checked=ev.target.checked);
  if(ev.target.dataset && ev.target.dataset.on!==undefined) ev.target.closest('.mod').classList.toggle('on', ev.target.checked);
  if(ev.target.id==='restore' && ev.target.files[0]){ const txt=await ev.target.files[0].text(); try{ JSON.parse(txt); if(confirm('현재 기기 데이터를 백업 파일로 덮어쓸까요?')){ localStorage.setItem(DB_KEY, txt); S.version=null; refresh(true); toast('복원 완료'); } }catch(e){ toast('올바른 백업 파일이 아닙니다.'); } }
});
document.addEventListener('input', ev=>{
  if(ev.target.id==='pq'){ clearTimeout(window._pqT); const q=ev.target.value.trim(); if(!q){ $('#pqList').hidden=true; return; } window._pqT=setTimeout(async()=>{ try{ showPq(await Store.findPatients(q), q); }catch(e){} },150); }

document.addEventListener('keydown', ev=>{ if(ev.key==='Enter' && ev.target.id==='pq') $('[data-act=pSearch]').click(); });
function showPq(rs, q=''){ const l=$('#pqList'); if(!l) return; l.innerHTML=rs.map((p,i)=>acItemHtml(p,q,i).replace('data-i=', `data-reg="${esc(p.regNo)}" data-i=`)).join(''); l.hidden=!rs.length; l.onclick=e=>{ const b=e.target.closest('button'); if(b){ l.hidden=true; loadPatientView(b.dataset.reg); } }; }

function openPaste(){
  openDlg(`<div class="dlg-h"><h2>접수명단 붙여넣기</h2><span class="grow"></span><button class="btn sm" data-act="close">닫기</button></div>
  <div class="dlg-b"><p class="small muted" style="margin:0">EMR 접수 화면에서 복사해 붙여넣으세요. 한 줄에 한 명, <b>등록번호 이름</b> 순서 (탭·공백 구분). 줄에 <b>자보</b>(또는 TA)·<b>산재</b>가 있으면 보험 구분도 표시됩니다. 재진 환자는 지난 부위가 자동으로 들어가고, 대기 목록의 [부위]로 1차 설정할 수 있습니다.</p>
  <textarea id="pasteT" rows="10" placeholder="10234  홍길동&#10;10877  김영희"></textarea><div id="pasteP" class="small muted"></div></div>
  <div class="dlg-f"><button class="btn" data-act="close">취소</button><button class="btn pri" data-act="doPaste">대기 명단에 추가</button></div>`);
}
function parsePaste(text){
  return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{ const m=l.match(/^(\d[\w-]*)[\s,\t]+([^\s,\t\d][^\t,]*?)(?:[\t,].*)?$/); if(!m) return null;
    const name=m[2].trim().split(/\s{2,}/)[0].replace(/\s+(자보|자동차보험|산재|TA)\s*$/i,'');   // '홍길동 자보' 처럼 띄어 쓴 표시만 (이름 속 글자는 그대로)
    const rest=l.slice(m[1].length).replace(name,'');   // 이름을 뺀 나머지 칸에서 보험 표시 찾기
    const ins=/자보|자동차|\bTA\b/i.test(rest)?'자보':/산재/.test(rest)?'산재':'';
    return {regNo:m[1], name, ins}; }).filter(Boolean);
}
async function doPaste(){
  const list=parsePaste($('#pasteT').value); if(!list.length){ $('#pasteP').textContent='인식된 환자가 없습니다. "등록번호 이름" 형식인지 확인하세요.'; return; }
  const exist=new Set(S.records.filter(r=>['waiting','running'].includes(r.status)).map(r=>r.regNo));
  const add=list.filter(p=>!exist.has(p.regNo)); closeDlg();
  const recs=[];
  for(const p of add){ const r={id:uid(), createdAt:nowIso(), date:S.date, regNo:p.regNo, name:p.name, ins:p.ins||'', status:'waiting', items:[], room:'', bed:null}; recs.push(r); await saveRecord(r, {quiet:true}); }
  toast(`${add.length}명 대기 명단에 추가${list.length>add.length?` (중복 ${list.length-add.length}명 제외)`:''} — 재진 환자는 지난 부위를 불러옵니다.`, '', 5000);
  // 1차 부위: 재진 환자는 지난 처방의 부위·보험을 미리 채움 (대기 목록의 [부위]로 확인·수정)
  for(const r of recs){
    let res; try{ res=await Store.getPatient(r.regNo); }catch(e){ continue; }
    const pl=res&&res.patient&&res.patient.plan; if(!pl) continue;
    const cur=S.records.find(x=>x.id===r.id); if(!cur || cur.status!=='waiting' || siteText(cur)) continue;
    const u=withBase(cur); u.sites=pl.sites||[]; u.side=pl.side||''; if(!u.ins && pl.ins) u.ins=pl.ins;
    await saveRecord(u, {quiet:true});
  }
}
function openCsv(){
  const first=S.ledgerDate.slice(0,8)+'01';
  openDlg(`<div class="dlg-h"><h2>엑셀(CSV) 내보내기</h2><span class="grow"></span><button class="btn sm" data-act="close">닫기</button></div>
  <div class="dlg-b"><div class="grid2"><label class="f"><span>시작일</span><input type="date" id="cFrom" value="${first}"></label><label class="f"><span>종료일</span><input type="date" id="cTo" value="${S.ledgerDate}"></label></div>
  ${IS_GAS?'<p class="small muted">구글 시트의 「기록_YYYY-MM」 탭에서도 같은 내용을 바로 볼 수 있습니다.</p>':IS_SERVER?'<p class="small muted">메인 PC 데이터 폴더의 「기록_YYYY-MM.csv」 파일에도 월별 대장이 자동 저장됩니다.</p>':''}</div>
  <div class="dlg-f"><button class="btn" data-act="close">취소</button><button class="btn pri" data-act="doCsv">내려받기</button></div>`);
}
async function saveSettingsForm(){
  const lines=id=>$('#'+id).value.split('\n').map(s=>s.trim()).filter(Boolean);
  S.local.device=$('#stDevice').value.trim(); S.local.sound=$('#stSound').checked; S.local.voice=$('#stVoice').checked; saveLocal();
  const s=clone(S.settings);
  s.rooms=s.rooms.map(r=>({...r, name:$(`[data-room-name="${r.id}"]`).value.trim()||r.name, beds:Math.min(40,Math.max(1,parseInt($(`[data-room-beds="${r.id}"]`).value)||r.beds)), first:Math.max(1,parseInt($(`[data-room-first="${r.id}"]`).value)||r.first||1)}));
  s.hospital=$('#stHospital').value.trim();
  s.fixedPre=$('#stFixedPre').value.trim(); s.fixedPost=$('#stFixedPost').value.trim();
  s.doctors=lines('stDoctors'); s.therapists=lines('stTherapists'); s.sites=lines('stSites'); s.showCode=$('#stShowCode').checked;
  s.phrases={pre:lines('stPre'), during:lines('stDuring'), post:lines('stPost')};
  s.mods={};
  for(const tr of $$('#stModTable [data-mod]')){ const base=MODALITIES.find(m=>m.id===tr.dataset.mod), o={};
    for(const el of $$('[data-k]',tr)){ const v = el.type==='checkbox'?el.checked : el.type==='number'?Math.max(1,parseInt(el.value)||1) : el.value.trim(); if(!base || v!==base[el.dataset.k]) o[el.dataset.k]=v; }
    if(Object.keys(o).length) s.mods[tr.dataset.mod]=o; }   // 기본값과 다른 것만 저장 → 프로그램 기본값이 바뀌면 자동 반영
  await run(Store.saveSettings(s)); S.settings=mergeSettings(s); toast('설정을 저장했습니다.'); render();
}

/* ===================== 시작 ===================== */
(async function boot(){
  if(!IS_GAS && !IS_SERVER){
    // zip 안에서 열거나 임시 폴더에서 열면 주소가 매번 바뀌어 브라우저 저장소가 이어지지 않음
    const tmp=/\/(temp|tmp)\/|\.zip\//i.test(decodeURIComponent(location.pathname));
    $('#banner').innerHTML = tmp
      ? '<div class="banner" style="background:var(--bad-soft);color:#991b1b">⚠ 압축 파일(zip) 안이나 임시 폴더에서 연 상태입니다. 이렇게 열면 다시 열 때 기록이 이어지지 않습니다. 파일을 고정된 폴더(예: C:\\물리치료기록)에 복사한 뒤 여세요.</div>'
      : '<div class="banner">이 기기 단독 모드 — 기록이 이 브라우저에만 저장됩니다. 여러 기기에서 함께 쓰려면 메인 PC 프로그램이나 구글 시트로 설치하세요(README 참고). [설정]에서 정기적으로 백업하세요.</div>';
  }
  if(IS_SERVER) Store.call('serverInfo').then(i=>{ if(i.tempRun) $('#banner').innerHTML='<div class="banner" style="background:var(--bad-soft);color:#991b1b">⚠ zip 파일 안에서 바로 실행 중입니다. 기록은 안전하게 저장되지만 프로그램 파일이 임시 폴더라 곧 지워집니다. zip을 [압축 풀기] 한 뒤 푼 폴더의 물리치료기록.exe 를 실행하세요.</div>'; }).catch(()=>{});
  S.room=S.local.room||'pt';
  try{
    const res=await run(Store.init(S.date),'불러오는 중…');
    S.settings=mergeSettings(res.settings); S.records=res.records||[]; S.version=res.version;
    // 화면을 새로 열었을 때 이미 지난 알람은 다시 울리지 않음
    // 화면을 새로 열었을 때 이미 지난 알람은 checkAlarms 가 소리 없이 넘김
  }catch(e){ $('#main').innerHTML='<div class="empty-note">데이터를 불러오지 못했습니다. 새로고침해 주세요.</div>'; return; }
  if(!S.settings.therapists.length && !S.settings.doctors.length) toast('[설정]에서 처방의·치료사 명단을 먼저 입력하세요.', '', 6000);
  render();
  setInterval(tick, 1000);
  setInterval(()=>{ if(ymd()!==S.date){ S.date=ymd(); S.ledgerDate=S.date; S.version=null; } if(!document.hidden) refresh(); }, IS_GAS?8000:IS_SERVER?3000:3000);
  window.addEventListener('storage', e=>{ if(e.key===DB_KEY) refresh(); });
  window.addEventListener('focus', ()=>refresh());
})();
</script>
</body>
