<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>카피바라 온천 귀환</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
/* Layout: slim field HUD on top, raid map fills the rest; the camp and the loot screen are panels over the map. */
:root {
  color-scheme: dark;
  --soil: #14170f; --panel: #1f2418; --cell: #262c1d; --line: #3a4230;
  --text: #ece6d2; --muted: #a3a58c;
  --yuzu: #f2a531; --moss: #8fb85a; --blood: #d9553f; --steam: #7fd0c4;
  --r1: #6fae5c; --r2: #5c9bd6; --r3: #e0b040;
  --display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--soil); color: var(--text); font-family: var(--body); font-size: 14px;
  display: flex; flex-direction: column; gap: 8px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-variant-numeric: tabular-nums; }
.hud h1 { font-family: var(--display); font-weight: 400; font-size: 20px; margin: 0; color: var(--yuzu); }
.bars { flex: 1 1 130px; min-width: 110px; max-width: 230px; display: flex; flex-direction: column; gap: 3px; }
.bar { height: 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.bar.thin { height: 5px; }
.bar i { display: block; height: 100%; width: 100%; background: var(--moss); }
#stFill { background: var(--steam); }
.stat { color: var(--muted); white-space: nowrap; }
.stat b { color: var(--text); font-weight: 600; }
.acts { display: flex; flex-wrap: wrap; gap: 5px; margin-left: auto; }
button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--yuzu); }
button:focus-visible { outline: 2px solid var(--yuzu); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: default; }
.stage { position: relative; flex: 1; min-height: 0; border-radius: 12px; overflow: hidden; background: #0a0c08; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: none; }
.toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(20,23,15,0.88); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; pointer-events: none; max-width: 90%; text-align: center; z-index: 3; }
.inv { position: absolute; inset: 0; overflow-y: auto; background: rgba(14,16,10,0.94); padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px; z-index: 2; }
.inv.raid { background: rgba(14,16,10,0.86); }
.inv-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.inv-h h2 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; color: var(--yuzu); }
.inv-h .money { font-size: 16px; font-variant-numeric: tabular-nums; }
.inv-h .sp { flex: 1; }
.go { font-family: var(--display); font-size: 18px; padding: 8px 26px; background: var(--yuzu); color: var(--soil); border-color: var(--yuzu); }
.go:hover:not(:disabled) { background: var(--text); border-color: var(--text); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tabs button.on { border-color: var(--yuzu); color: var(--yuzu); }
.report { border-left: 3px solid var(--moss); padding: 2px 0 2px 12px; line-height: 1.6; }
.report.lost { border-color: var(--blood); }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; align-items: start; }
.cols section { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.cols h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(66px, 1fr)); gap: 6px; }
.cell { position: relative; aspect-ratio: 1; min-width: 0; padding: 4px 3px 3px; background: var(--cell); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 1px; overflow: hidden; color: var(--text); }
div.cell { color: var(--muted); font-size: 11px; justify-content: center; text-align: center; opacity: 0.7; }
.cell img { flex: 1; min-height: 0; max-width: 92%; object-fit: contain; }
.cell .nm { font-size: 10px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.cell .q { position: absolute; top: 2px; right: 4px; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
.cell .tag { position: absolute; top: 2px; left: 4px; font-size: 10px; color: var(--yuzu); text-shadow: 0 1px 2px #000; font-variant-numeric: tabular-nums; }
.cell .dur { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--moss); }
.cell.r1 { border-color: var(--r1); } .cell.r2 { border-color: var(--r2); } .cell.r3 { border-color: var(--r3); }
.cell.g1 { border-color: #5c9bd6; } .cell.g2 { border-color: #a678e0; } .cell.g3 { border-color: #e0b040; } .cell.g4 { border-color: #ff6a4a; box-shadow: inset 0 0 10px rgba(255,106,74,0.35); }
.cell.g2, .cell.g3 { box-shadow: inset 0 0 8px rgba(166,120,224,0.22); }
.gt1 { color: #7fb4e8; } .gt2 { color: #bb93ee; } .gt3 { color: #e8bd55; } .gt4 { color: #ff8566; }
.cell.on { outline: 2px solid var(--yuzu); outline-offset: 1px; }
.fx-ap { filter: hue-rotate(250deg) saturate(1.4); } .fx-shell { filter: hue-rotate(290deg) saturate(1.3); }
.fx-heavy { filter: hue-rotate(120deg); } .fx-dark { filter: brightness(0.6) contrast(1.25); }
.detail { position: sticky; bottom: 0; margin: 0 -16px; padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; min-height: 30px; }
.detail .info { flex: 1 1 220px; min-width: 0; line-height: 1.5; }
.detail .info small { display: block; color: var(--muted); }
.detail .btns { display: flex; flex-wrap: wrap; gap: 6px; }
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.row div { flex: 1; min-width: 0; }
.row small { display: block; color: var(--muted); }
.row.done { opacity: 0.5; }
.keys { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 0; }
.mods { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mods .slot { color: var(--muted); font-size: 12px; padding: 4px 8px; border: 1px dashed var(--line); border-radius: 8px; }
.mods button.in { border-color: var(--r2); }
.net { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.net input { font: inherit; color: var(--text); background: var(--cell); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; width: 110px; min-width: 0; }
.net input:focus-visible { outline: 2px solid var(--yuzu); outline-offset: 1px; }
.net small { color: var(--muted); flex: 1 1 200px; min-width: 0; line-height: 1.5; }
.net .who { flex: 1 1 200px; min-width: 0; line-height: 1.6; }
.net .who b { color: var(--yuzu); }
.npc { display: flex; align-items: center; gap: 12px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.npc img { width: 64px; height: 64px; object-fit: contain; flex: none; }
.npc div { min-width: 0; line-height: 1.5; }
.npc small { display: block; color: var(--muted); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes drop { from { opacity: 0; transform: translate(-50%, -8px); } }
.inv { animation: rise 0.16s ease-out; }
.toast { animation: drop 0.18s ease-out; }
.bar i { transition: width 0.18s ease-out; }
.cell { transition: transform 0.1s ease-out, border-color 0.1s; }
button.cell:hover { transform: translateY(-2px); }
button.cell:active { transform: scale(0.95); }
@media (prefers-reduced-motion: reduce) { .inv, .toast { animation: none; } .bar i, .cell { transition: none; } }
</style>
